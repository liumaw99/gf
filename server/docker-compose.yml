services:
  postgres:
    image: postgres:16-alpine
    container_name: lagom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lagom
      POSTGRES_PASSWORD: lagom
      POSTGRES_DB: lagom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lagom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lagom-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      LAGOM_SERVER_PORT: 8080
      LAGOM_SERVER_MODE: debug
      LAGOM_DATABASE_DSN: postgres://lagom:lagom@postgres:5432/lagom?sslmode=disable
      LAGOM_REDIS_ADDR: redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:

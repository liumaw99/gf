# Lagom Server 配置文件模板
# 生产环境请使用环境变量覆盖

server:
  port: 8080
  mode: debug  # debug / release

database:
  dsn: "postgres://lagom:lagom@localhost:5432/lagom?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  max_lifetime_sec: 3600

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "change-this-in-production"
  access_ttl_min: 15
  refresh_ttl_hour: 168  # 7 days

ai:
  deepseek_key: ""      # 从环境变量 DEEPSEEK_API_KEY 读取
  fallback_key: ""      # 从环境变量 OPENAI_API_KEY 读取
  max_tokens: 300
  temperature: 0.7
